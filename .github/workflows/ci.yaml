name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v14

      - name: Cache the store
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      - name: Check formatting
        working-directory: nix
        run: nix fmt -- --ci

      - name: Flake check
        working-directory: nix
        run: nix flake check --print-build-logs

      # Evaluation is cross-platform, so a linux runner can still prove the
      # darwin hosts resolve and that every referenced file exists.
      - name: Evaluate the darwin hosts
        working-directory: nix
        run: |
          for host in Francos-MacBook-Air work-mbp; do
            echo "::group::$host"
            nix eval --raw ".#darwinConfigurations.$host.system.drvPath"
            echo
            echo "::endgroup::"
          done

      # The one host that cannot be built from a mac, so CI is the only place
      # it ever gets compiled.
      - name: Build the linux host
        working-directory: nix
        run: |
          nix build --print-build-logs \
            ".#nixosConfigurations.nixos-x86_64.config.system.build.toplevel"
