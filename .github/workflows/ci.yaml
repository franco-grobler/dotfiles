name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v14

      - name: Cache the store
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      - name: Check formatting
        working-directory: nix
        run: nix fmt -- --ci

      - name: Flake check
        working-directory: nix
        run: nix flake check --print-build-logs

      # Evaluation is cross-platform, so a linux runner can still prove the
      # darwin hosts resolve and that every referenced file exists. The list
      # comes from the flake, so adding a host stays a one-file change.
      - name: Evaluate the darwin hosts
        working-directory: nix
        run: |
          hosts=$(nix eval --raw .#darwinConfigurations \
            --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')
          echo "hosts: $hosts"
          for host in $hosts; do
            echo "::group::$host"
            nix eval --raw ".#darwinConfigurations.$host.system.drvPath"
            echo
            echo "::endgroup::"
          done

      # These cannot be built from a mac, so CI is the only place they ever
      # get compiled. Derived from the flake for the same reason as above.
      - name: Build the linux hosts
        working-directory: nix
        run: |
          hosts=$(nix eval --raw .#nixosConfigurations \
            --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')
          echo "hosts: $hosts"
          for host in $hosts; do
            echo "::group::$host"
            nix build --print-build-logs \
              ".#nixosConfigurations.$host.config.system.build.toplevel"
            echo "::endgroup::"
          done
