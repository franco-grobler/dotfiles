name: Continuous Integration

# Pull requests only. Building three hosts on every push to every branch is
# minutes of runner time per `git push` on work nobody is reviewing yet, and
# the checks that matter are the ones gating a merge.
#
# The trade is that a commit pushed straight to `main` is not checked by CI --
# the pre-commit hook and `just nix-check` are what cover that locally.
# `workflow_dispatch` stays as the manual escape hatch; it never fires on its
# own.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Every host is a `checks` output (nix/modules/flake/checks.nix), so this
    # matrix is the whole story: each runner builds the hosts that belong to
    # its own system and skips the rest. Adding a host changes nothing here.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          # The machines actually in daily use are macs, so they get built
          # rather than merely evaluated -- this is the job that catches a
          # broken darwin build before a `just nix-switch` does.
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v14

      - name: Cache the store
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      # Optional: set the CACHIX_CACHE variable and the CACHIX_AUTH_TOKEN
      # secret to push what this builds to your own cache, so the other mac
      # downloads the unstable cherry-picks instead of rebuilding them. Inert
      # until those are configured.
      #
      # `if:` skips the step, not the action: GitHub resolves every `uses:` in
      # the workflow during "Set up job", before any step runs. A bad pin here
      # fails the whole job in seconds even though the step never executes, so
      # this SHA has to be a real one.
      - name: Use the personal cache
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Repo-wide: treefmt's root is the git repo, not the flake directory.
      - name: Check formatting
        working-directory: nix
        run: nix fmt -- --ci

      # Builds every host for this runner's system, plus the nix lints
      # (statix, deadnix). The same command developers run locally.
      - name: Flake check
        working-directory: nix
        run: nix flake check --print-build-logs

      # Cheap proof that the hosts belonging to the *other* runner still
      # evaluate and that every file they reference exists -- evaluation is
      # cross-platform even where building is not.
      - name: Evaluate every host
        working-directory: nix
        run: |
          for class in darwinConfigurations nixosConfigurations; do
            hosts=$(nix eval --raw ".#${class}" \
              --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)')
            for host in $hosts; do
              echo "::group::${class}.${host}"
              case "$class" in
                darwinConfigurations)
                  nix eval --raw ".#${class}.\"${host}\".system.drvPath" ;;
                nixosConfigurations)
                  nix eval --raw ".#${class}.\"${host}\".config.system.build.toplevel.drvPath" ;;
              esac
              echo
              echo "::endgroup::"
            done
          done
