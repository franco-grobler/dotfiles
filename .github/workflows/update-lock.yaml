# Weekly lockfile bump, as a pull request so CI has to agree before it lands.
#
# The manual path is still `just nix-update`, which also updates brew and mas;
# this one only moves flake.lock, which is the part that can be checked without
# a machine in front of it.
name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Bump flake.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v14

      - name: Update the lockfile
        uses: DeterminateSystems/update-flake-lock@main
        with:
          path-to-flake-dir: nix
          pr-title: "chore(nix): update nix flake lockfile"
          pr-labels: dependencies
          commit-msg: "chore(nix): update nix flake lockfile"
