# Key bindings. Sourced from default.nix, after tmux.conf.
#
# This file used to be called tmux.reset.conf, but it never reset anything --
# there is no `unbind -a` here and never was, so it only ever added bindings
# on top of tmux's defaults. Renamed to say what it does.

# Server / client
bind ^X lock-server
bind ^D detach
bind ^L refresh-client
bind : command-prompt
# (prefix + R reloads; bound in default.nix, which knows the real config path.)

# Sessions
bind S choose-session

# Windows
bind ^C new-window -c "$HOME"
bind ^A last-window
bind H previous-window
bind L next-window
bind ^W list-windows
bind w list-windows
bind '"' choose-window
bind r command-prompt "rename-window %%"

# Panes: splits keep the current pane's directory, except the bare `|`, which
# deliberately starts from the session's own path.
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7

bind z resize-pane -Z
bind x swap-pane -D
bind c kill-pane
bind P set pane-border-status
bind * setw synchronize-panes
bind K send-keys "clear"\; send-keys "Enter"

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
