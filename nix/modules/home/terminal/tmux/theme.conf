# tokyonight "moon", kept in sync with the Neovim colorscheme so the editor
# and the tmux chrome read as one surface. Palette:
# https://github.com/folke/tokyonight.nvim/blob/main/lua/tokyonight/colors/moon.lua
#
#   bg #222436   bg_dark #1e2030   bg_highlight #2f334d   fg_gutter #3b4261
#   fg #c8d3f5   fg_dark #828bb8   blue #82aaff  magenta #c099ff
#   green #c3e88d  red #ff757f     yellow #ffc777

# Panes only paint the cells a program writes to; window-style colours the
# rest so empty regions match Neovim's background exactly.
set -g window-style 'bg=#222436'
set -g window-active-style 'bg=#222436'

set -g pane-border-style 'fg=#3b4261,bg=#222436'
set -g pane-active-border-style 'fg=#82aaff,bg=#222436'

set -g message-style 'fg=#222436,bg=#82aaff,bold'
set -g message-command-style 'fg=#222436,bg=#ffc777,bold'
set -g mode-style 'fg=#222436,bg=#c099ff,bold'

set -g status on
set -g status-position top
set -g status-justify left
set -g status-style 'fg=#828bb8,bg=#1e2030'
set -g status-left-length 100
set -g status-right-length 100

# Rounded separators: U+E0B6 and U+E0B4 from the Nerd Font "powerline extra"
# range, so each module is a filled pill rather than an arrow.
set -g status-left "#[fg=#c3e88d,bg=#1e2030]#[fg=#222436,bg=#c3e88d,bold] #S #[fg=#c3e88d,bg=#1e2030] "

set -g status-right "#[fg=#c099ff,bg=#1e2030]#[fg=#222436,bg=#c099ff,bold]  #{b:pane_current_path} #[fg=#c099ff,bg=#1e2030]"
set -ag status-right "#[fg=#82aaff,bg=#1e2030]#[fg=#222436,bg=#82aaff,bold]  %Y-%m-%d %H:%M #[fg=#82aaff,bg=#1e2030]"

set -g window-status-separator ""
set -g window-status-format "#[fg=#2f334d,bg=#1e2030]#[fg=#828bb8,bg=#2f334d] #I #W #[fg=#2f334d,bg=#1e2030] "
set -g window-status-current-format "#[fg=#82aaff,bg=#1e2030]#[fg=#222436,bg=#82aaff,bold] #I #W#{?window_zoomed_flag, ,} #[fg=#82aaff,bg=#1e2030] "
set -g window-status-bell-style "fg=#ff757f,bg=#1e2030,bold"
