# Core tmux settings. Everything visual lives in theme.conf and every binding
# in keybindings.conf; this file is the behaviour of the server itself.
#
# This is the static half of programs.tmux.extraConfig. Everything that needs
# a path or a store path -- the source-file lines that pull in theme.conf and
# keybindings.conf, the reload binding, resurrect's save directory and the
# continuum re-arm -- is appended from default.nix, so those resolve through
# Nix's xdg.configHome/xdg.dataHome rather than a hardcoded ~/.config.

set-option -g allow-passthrough on

# default-terminal (set from Nix) describes the terminal tmux *emulates* for
# the programs inside it, not the one it is running in. Truecolor, by
# contrast, is a property of the *outer* terminal, so it is declared with
# terminal-features keyed on the client's TERM. RGB supersedes the older Tc
# override, and -as appends rather than clobbering tmux's own defaults.
set-option -as terminal-features ',xterm*:RGB'
set-option -as terminal-features ',*ghostty*:RGB'

set-option -g renumber-windows on
set-option -g detach-on-destroy off
set-option -g set-clipboard on

setw -g mode-keys vi

# Save-only: continuum keeps a 15-minute snapshot history. Its own
# auto-restore stays off; a new server is brought up by tmux-start (see
# default.nix), which restores the last snapshot only where
# dotfiles.tmux.restoreOnStart is set (the work profile). Elsewhere sessions
# come back on demand via sesh/tmuxinator, or deliberately with resurrect's
# own binding (prefix + C-r).
set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'
